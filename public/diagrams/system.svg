<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">センサー増幅ADCマイコンMOSFET負荷の機能接続図</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="25" y="30" font-size="19" fill="#205c48" text-anchor="start">信号の流れと、電源・GND</text><rect x="20" y="123" width="100" height="82" rx="5"/><text x="70" y="155" font-size="15" fill="#205c48" text-anchor="middle">センサー</text><text x="70" y="183" font-size="12" fill="#64786b" text-anchor="middle">0〜1 V</text><path d="M120 164L134 164" marker-end="url(#arrow)"/><path d="M70 205L70 270" /><rect x="136" y="123" width="100" height="82" rx="5"/><text x="186" y="155" font-size="15" fill="#205c48" text-anchor="middle">増幅器</text><text x="186" y="183" font-size="12" fill="#64786b" text-anchor="middle">ゲイン3</text><path d="M236 164L250 164" marker-end="url(#arrow)"/><path d="M186 205L186 270" /><rect x="252" y="123" width="100" height="82" rx="5"/><text x="302" y="155" font-size="15" fill="#205c48" text-anchor="middle">ADC</text><text x="302" y="183" font-size="12" fill="#64786b" text-anchor="middle">電圧→数値</text><path d="M352 164L366 164" marker-end="url(#arrow)"/><path d="M302 205L302 270" /><rect x="368" y="123" width="100" height="82" rx="5"/><text x="418" y="155" font-size="15" fill="#205c48" text-anchor="middle">マイコン</text><text x="418" y="183" font-size="12" fill="#64786b" text-anchor="middle">判定</text><path d="M468 164L482 164" marker-end="url(#arrow)"/><path d="M418 205L418 270" /><rect x="484" y="123" width="100" height="82" rx="5"/><text x="534" y="155" font-size="15" fill="#205c48" text-anchor="middle">MOSFET</text><text x="534" y="183" font-size="12" fill="#64786b" text-anchor="middle">駆動</text><path d="M584 164L598 164" marker-end="url(#arrow)"/><path d="M534 205L534 270" /><rect x="600" y="123" width="100" height="82" rx="5"/><text x="650" y="155" font-size="15" fill="#205c48" text-anchor="middle">負荷</text><text x="650" y="183" font-size="12" fill="#64786b" text-anchor="middle">5 V / 50 mA</text><path d="M650 205L650 270" /><path d="M70 270L650 270" /><path d="M360 270v10m-17 0h34m-28 7h22m-16 7h10" /><text x="30" y="83" font-size="16" fill="#64786b" text-anchor="start">アナログ信号の基準と負荷電流の帰路を意識する</text><text x="30" y="326" font-size="14" fill="#64786b" text-anchor="start">詳細回路は設計3・5・7を参照。接続点ごとに、単体 → 全体の順で検証。</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>