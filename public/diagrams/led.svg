<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">LEDと620Ω抵抗の直列回路</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="30" y="33" font-size="19" fill="#205c48" text-anchor="start">LED点灯回路</text><text x="35" y="137" font-size="17" fill="#205c48" text-anchor="start">＋5 V</text><path d="M70 155L105 155" /><path d="M105 155L150.0 155" /><rect x="150.0" y="145" width="50" height="20"/><path d="M200.0 155L245 155" /><text x="175.0" y="132" font-size="16" fill="#205c48" text-anchor="middle">R1 620 Ω</text><path d="M245 155L320 155" /><path d="M320 155H340M340 139L367 155L340 171ZM367 135V175M367 155H390" /><path d="M358 133l17-16m-8 0h8v8M374 145l17-16m-8 0h8v8" /><path d="M390 155L555 155" /><path d="M555 155L555 220" /><path d="M555 220v10m-17 0h34m-28 7h22m-16 7h10" /><text x="315" y="205" font-size="17" fill="#205c48" text-anchor="start">A</text><text x="372" y="205" font-size="17" fill="#205c48" text-anchor="start">K</text><text x="326" y="106" font-size="17" fill="#205c48" text-anchor="start">D1 LED</text><text x="490" y="277" font-size="17" fill="#205c48" text-anchor="start">GND / 0 V</text><path d="M118 235h130" marker-end="url(#arrow)"/><text x="126" y="267" font-size="16" fill="#205c48" text-anchor="start">I ≈ 4.84 mA</text><text x="30" y="320" font-size="15" fill="#64786b" text-anchor="start">電流は＋電源 → 抵抗 → LED → GND → 電源−へ戻る</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>