<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">絶縁された12V直流から3.3Vを作るブロック図</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="25" y="30" font-size="19" fill="#205c48" text-anchor="start">12 V → 3.3 Vの電源構成</text><rect x="25" y="110" width="115" height="80" rx="5"/><text x="82.5" y="142" font-size="16" fill="#205c48" text-anchor="middle">DC 12 V</text><text x="82.5" y="170" font-size="12" fill="#64786b" text-anchor="middle">絶縁済み入力</text><path d="M82.5 190L82.5 267" /><rect x="185" y="110" width="100" height="80" rx="5"/><text x="235.0" y="142" font-size="16" fill="#205c48" text-anchor="middle">入力保護</text><text x="235.0" y="170" font-size="12" fill="#64786b" text-anchor="middle">逆接・過電流</text><path d="M235.0 190L235.0 267" /><rect x="335" y="110" width="155" height="80" rx="5"/><text x="412.5" y="142" font-size="16" fill="#205c48" text-anchor="middle">降圧DC-DC</text><text x="412.5" y="170" font-size="12" fill="#64786b" text-anchor="middle">メーカー推奨C</text><path d="M412.5 190L412.5 267" /><rect x="550" y="110" width="140" height="80" rx="5"/><text x="620.0" y="142" font-size="16" fill="#205c48" text-anchor="middle">マイコン</text><text x="620.0" y="170" font-size="12" fill="#64786b" text-anchor="middle">電源直近にC</text><path d="M620.0 190L620.0 267" /><path d="M140 140L185 140" marker-end="url(#arrow)"/><path d="M285 140L335 140" marker-end="url(#arrow)"/><path d="M490 140L550 140" marker-end="url(#arrow)"/><text x="500" y="115" font-size="15" fill="#205c48" text-anchor="start">3.3 V</text><path d="M83 267L620 267" /><path d="M380 267v10m-17 0h34m-28 7h22m-16 7h10" /><text x="26" y="328" font-size="14" fill="#64786b" text-anchor="start">方式を示すブロック図。入力・出力C、保護定数は採用モジュールの仕様に従う。</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>