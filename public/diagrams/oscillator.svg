<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">シュミットインバータ出力からRCへ帰還する発振回路</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="25" y="30" font-size="19" fill="#205c48" text-anchor="start">シュミットインバータのRC発振</text><path d="M275 90L275 240L430 165z" /><circle cx="440" cy="165" r="10"/><path d="M300 133h13v36h13v-22m-13 22v25h-13v-27" /><path d="M140 165L275 165" /><circle cx="185" cy="165" r="4" fill="#205c48"/><path d="M450 165L620 165" /><circle cx="545" cy="165" r="4" fill="#205c48"/><path d="M545 165L545 65" /><path d="M185 65L340.0 65" /><rect x="340.0" y="55" width="50" height="20"/><path d="M390.0 65L545 65" /><text x="365.0" y="42" font-size="16" fill="#205c48" text-anchor="middle">R</text><path d="M185 65L185 165" /><path d="M185 165V216.5m-20 0h40m-40 12h40m-20 0V280" /><text x="212" y="227.5" font-size="16" fill="#205c48" text-anchor="start">C</text><path d="M185 280v10m-17 0h34m-28 7h22m-16 7h10" /><text x="566" y="144" font-size="16" fill="#205c48" text-anchor="start">出力</text><text x="270" y="289" font-size="16" fill="#205c48" text-anchor="start">上下のしきい値の間を充放電</text><text x="35" y="332" font-size="13" fill="#64786b" text-anchor="start">周期はR・CだけでなくICのしきい値にも依存。電源・デカップリングは省略。</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>