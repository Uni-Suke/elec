<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">RCローパスとハイパスの接続比較</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="30" y="33" font-size="18" fill="#205c48" text-anchor="start">ローパス：Cの両端を出力に</text><text x="383" y="33" font-size="18" fill="#205c48" text-anchor="start">ハイパス：Rの両端を出力に</text><path d="M40 120L105.0 120" /><rect x="105.0" y="110" width="50" height="20"/><path d="M155.0 120L220 120" /><text x="130.0" y="97" font-size="16" fill="#205c48" text-anchor="middle">R</text><path d="M220 120L310 120" /><circle cx="245" cy="120" r="4" fill="#205c48"/><path d="M245 120V169.0m-20 0h40m-40 12h40m-20 0V230" /><text x="272" y="180.0" font-size="16" fill="#205c48" text-anchor="start">C</text><path d="M245 230v10m-17 0h34m-28 7h22m-16 7h10" /><text x="30" y="94" font-size="15" fill="#205c48" text-anchor="start">Vin</text><text x="275" y="99" font-size="15" fill="#205c48" text-anchor="start">Vout</text><text x="48" y="294" font-size="16" fill="#205c48" text-anchor="start">遅い変化を通す</text><path d="M390 120H474.0m0-20v40m12-40v40m0-20H570" /><text x="480.0" y="91" font-size="16" fill="#205c48" text-anchor="middle">C</text><path d="M570 120L670 120" /><circle cx="600" cy="120" r="4" fill="#205c48"/><path d="M600 120L600 153.0" /><rect x="590" y="153.0" width="20" height="44"/><path d="M600 197.0L600 230" /><text x="623" y="180.0" font-size="16" fill="#205c48" text-anchor="start">R</text><path d="M600 230v10m-17 0h34m-28 7h22m-16 7h10" /><text x="380" y="94" font-size="15" fill="#205c48" text-anchor="start">Vin</text><text x="630" y="99" font-size="15" fill="#205c48" text-anchor="start">Vout</text><text x="398" y="294" font-size="16" fill="#205c48" text-anchor="start">速い変化を通す</text><text x="225" y="331" font-size="19" fill="#205c48" text-anchor="start">fc = 1 / (2πRC)</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>