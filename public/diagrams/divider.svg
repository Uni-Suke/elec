<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">抵抗分圧と並列電圧計</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="30" y="33" font-size="19" fill="#205c48" text-anchor="start">分圧と電圧測定</text><text x="180" y="65" font-size="17" fill="#205c48" text-anchor="start">Vin = 5 V</text><path d="M270 80L270 95.5" /><rect x="260" y="95.5" width="20" height="44"/><path d="M270 139.5L270 155" /><text x="293" y="122.5" font-size="16" fill="#205c48" text-anchor="start">R1 10 kΩ</text><path d="M270 155L270 180" /><circle cx="270" cy="180" r="4" fill="#205c48"/><path d="M270 180L270 205.5" /><rect x="260" y="205.5" width="20" height="44"/><path d="M270 249.5L270 275" /><text x="293" y="232.5" font-size="16" fill="#205c48" text-anchor="start">R2 10 kΩ</text><path d="M270 275v10m-17 0h34m-28 7h22m-16 7h10" /><path d="M270 180L535 180" /><text x="400" y="161" font-size="16" fill="#205c48" text-anchor="start">Vout ≈ 2.5 V</text><path d="M535 180L535 207" /><circle cx="535" cy="235" r="28"/><text x="535" y="241" font-size="20" fill="#205c48" text-anchor="middle">V</text><path d="M535 263L535 285" /><path d="M270 285L535 285" /><text x="577" y="239" font-size="15" fill="#205c48" text-anchor="start">DMM</text><text x="35" y="322" font-size="14" fill="#64786b" text-anchor="start">電圧計は出力とGNDの間へ。低抵抗の負荷をつなぐと分圧比が変わる。</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>