<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">ダイオード半波整流とコンデンサ平滑と抵抗負荷</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="25" y="30" font-size="19" fill="#205c48" text-anchor="start">半波整流と平滑（共通GND）</text><text x="40" y="85" font-size="16" fill="#205c48" text-anchor="start">低電圧AC入力</text><path d="M75 120L185 120" /><path d="M185 120H205M205 104L232 120L205 136ZM232 100V140M232 120H255" /><path d="M255 120L590 120" /><circle cx="390" cy="120" r="4" fill="#205c48"/><path d="M390 120V186.5m-20 0h40m-40 12h40m-20 0V265" /><text x="417" y="197.5" font-size="16" fill="#205c48" text-anchor="start">C</text><text x="356" y="180" font-size="20" fill="#205c48" text-anchor="start">＋</text><path d="M590 120L590 170.5" /><rect x="580" y="170.5" width="20" height="44"/><path d="M590 214.5L590 265" /><text x="613" y="197.5" font-size="16" fill="#205c48" text-anchor="start">RL</text><path d="M75 275L590 275" /><path d="M390 265L390 275" /><path d="M590 265L590 275" /><path d="M390 275v10m-17 0h34m-28 7h22m-16 7h10" /><text x="481" y="98" font-size="16" fill="#205c48" text-anchor="start">Vout</text><text x="40" y="304" font-size="15" fill="#205c48" text-anchor="start">入力GND</text><text x="37" y="336" font-size="13" fill="#64786b" text-anchor="start">Dで正側だけ通す → Cが谷を補う。FGの出力電流・突入・C極性に注意。</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>