<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">SPDTと抵抗を使ったコンデンサ充放電回路</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="25" y="30" font-size="19" fill="#205c48" text-anchor="start">ゆっくり見るRCの充放電</text><text x="27" y="98" font-size="16" fill="#205c48" text-anchor="start">＋3 V</text><path d="M90 95L150 95" /><circle cx="150" cy="95" r="4" fill="#205c48"/><circle cx="150" cy="175" r="4" fill="#205c48"/><path d="M90 175L150 175" /><path d="M90 175v10m-17 0h34m-28 7h22m-16 7h10" /><circle cx="210" cy="133" r="4" fill="#205c48"/><path d="M210 133L155 98" /><path d="M210 133L307.5 133" /><rect x="307.5" y="123" width="50" height="20"/><path d="M357.5 133L455 133" /><text x="332.5" y="110" font-size="16" fill="#205c48" text-anchor="middle">100 kΩ</text><circle cx="455" cy="133" r="4" fill="#205c48"/><path d="M455 133V193.0m-20 0h40m-40 12h40m-20 0V265" /><text x="482" y="204.0" font-size="16" fill="#205c48" text-anchor="start">100 µF</text><text x="427" y="189" font-size="20" fill="#205c48" text-anchor="start">＋</text><path d="M455 265v10m-17 0h34m-28 7h22m-16 7h10" /><path d="M455 133L610 133" /><path d="M610 133L610 172" /><circle cx="610" cy="203" r="31"/><text x="610" y="211" font-size="22" fill="#205c48" text-anchor="middle">V</text><path d="M610 234L610 275" /><path d="M455 275L610 275" /><text x="85" y="239" font-size="15" fill="#205c48" text-anchor="start">SPDTで切替</text><text x="47" y="321" font-size="15" fill="#64786b" text-anchor="start">3 Vで充電、GNDで放電。どちらも100 kΩを通す。τ = 10 s</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>