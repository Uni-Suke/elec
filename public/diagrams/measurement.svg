<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">電圧計は並列、電流計は直列</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="25" y="33" font-size="19" fill="#205c48" text-anchor="start">電圧測定：並列</text><text x="390" y="33" font-size="19" fill="#205c48" text-anchor="start">電流測定：直列</text><text x="35" y="75" font-size="16" fill="#205c48" text-anchor="start">＋3 V</text><path d="M80 86L80 110" /><path d="M80 110L157.5 110" /><rect x="157.5" y="100" width="50" height="20"/><path d="M207.5 110L285 110" /><text x="182.5" y="87" font-size="16" fill="#205c48" text-anchor="middle">R 1 kΩ</text><path d="M285 110L285 270" /><path d="M285 270v10m-17 0h34m-28 7h22m-16 7h10" /><path d="M80 110L80 210" /><path d="M80 210L156 210" /><circle cx="183" cy="210" r="27"/><text x="183" y="216" font-size="21" fill="#205c48" text-anchor="middle">V</text><path d="M210 210L285 210" /><circle cx="80" cy="110" r="4" fill="#205c48"/><circle cx="285" cy="210" r="4" fill="#205c48"/><text x="55" y="313" font-size="15" fill="#64786b" text-anchor="start">赤V/Ω・黒COM</text><text x="399" y="76" font-size="16" fill="#205c48" text-anchor="start">＋3 V</text><path d="M443 85L443 110" /><path d="M443 110L481 110" /><circle cx="510" cy="110" r="29"/><text x="510" y="117" font-size="21" fill="#205c48" text-anchor="middle">A</text><path d="M539 110L620 110" /><path d="M620 110L620 148.0" /><rect x="610" y="148.0" width="20" height="44"/><path d="M620 192.0L620 230" /><text x="643" y="175.0" font-size="16" fill="#205c48" text-anchor="start">R</text><path d="M620 230L620 270" /><path d="M620 270v10m-17 0h34m-28 7h22m-16 7h10" /><text x="391" y="312" font-size="15" fill="#64786b" text-anchor="start">赤は指定電流端子・黒COM</text><text x="345" y="343" font-size="14" fill="#bb743c" text-anchor="middle">接続を変えるときは電源OFF</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>