<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title"><title id="title">比較器の入力とプルアップを持つ出力</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#205c48" stroke="none"/></marker></defs><rect width="720" height="350" fill="#f1f6f2" rx="7"/><g stroke="#205c48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><text x="25" y="30" font-size="19" fill="#205c48" text-anchor="start">比較器：オープンドレイン出力の例</text><path d="M265 95L265 243L420 168z" /><text x="283" y="140" font-size="22" fill="#205c48" text-anchor="start">＋</text><text x="283" y="210" font-size="22" fill="#205c48" text-anchor="start">−</text><path d="M50 132L265 132" /><text x="40" y="108" font-size="16" fill="#205c48" text-anchor="start">センサー入力</text><path d="M50 205L265 205" /><text x="42" y="239" font-size="16" fill="#205c48" text-anchor="start">基準電圧 Vref</text><path d="M420 168L655 168" /><circle cx="525" cy="168" r="4" fill="#205c48"/><path d="M525 59L525 91.5" /><rect x="515" y="91.5" width="20" height="44"/><path d="M525 135.5L525 168" /><text x="548" y="118.5" font-size="16" fill="#205c48" text-anchor="start">Rpull-up</text><text x="488" y="47" font-size="16" fill="#205c48" text-anchor="start">＋3.3 V</text><text x="576" y="148" font-size="16" fill="#205c48" text-anchor="start">出力</text><text x="445" y="232" font-size="15" fill="#205c48" text-anchor="start">入力 &gt; Vref：H</text><text x="445" y="265" font-size="15" fill="#205c48" text-anchor="start">入力 &lt; Vref：L</text><text x="30" y="324" font-size="13" fill="#64786b" text-anchor="start">電源端子とデカップリングは省略。入力範囲・出力耐圧・ヒステリシスを確認。</text></g><style>text{stroke:none;font-family:'Noto Sans JP',sans-serif}.caption{fill:#64786b}</style></svg>